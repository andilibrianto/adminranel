        <script type="module">
        import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js';
        import { initializeAppCheck, ReCaptchaV3Provider } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-app-check.js'; // Tambahan
        import { getAuth, signInWithEmailAndPassword, signOut, onAuthStateChanged } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js';
        import { getFirestore, collection, query, orderBy, onSnapshot, doc, updateDoc, getDocs } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js';

        const firebaseConfig = {
            apiKey: "AIzaSyDmDyI5olQ2a0zaxLIASH3EglRfsAmE7-Q",
            authDomain: "ranel-cell.firebaseapp.com",
            projectId: "ranel-cell",
            storageBucket: "ranel-cell.firebasestorage.app",
            messagingSenderId: "267696476787",
            appId: "1:267696476787:web:5fda181cfdaeec413e5006"
        };

        const app = initializeApp(firebaseConfig);
        const appCheck = initializeAppCheck(app, {
            provider: new ReCaptchaV3Provider('6Le6GHotAAAAANiAaJBAx3UoO3DY8EfPVush6jAs'),
            isTokenAutoRefreshEnabled: true
        });

        const auth = getAuth(app);
        const db = getFirestore(app);

        window.firebaseAdmin = {
            auth, db, collection, query, orderBy, onSnapshot, doc, updateDoc, getDocs,
            signInWithEmailAndPassword, signOut, onAuthStateChanged
        };
        window.dispatchEvent(new Event('firebase-admin-ready'));
    </script>

        body { font-family:'Poppins',sans-serif; background:#0A0A0A; color:#fff; margin:0; }

    <script>
        let currentDocId = null;
        let allOrders = [];

        window.addEventListener('firebase-admin-ready', function() {
            const { auth, onAuthStateChanged } = window.firebaseAdmin;

            onAuthStateChanged(auth, (user) => {
                if (user) {
                    document.getElementById('login-view').classList.add('hidden');
                    document.getElementById('dashboard-view').classList.remove('hidden');
                    loadOrders();
                } else {
                    document.getElementById('login-view').classList.remove('hidden');
                    document.getElementById('dashboard-view').classList.add('hidden');
                }
            });
        });
        function showLoading() {
            const el = document.getElementById('loading-overlay');
            if (el) el.classList.remove('hidden');
        }
        function hideLoading() {
            const el = document.getElementById('loading-overlay');
            if (el) el.classList.add('hidden');
        }

        window.addEventListener('firebase-admin-ready', function() {
            const { auth, onAuthStateChanged } = window.firebaseAdmin;

            showLoading();

            onAuthStateChanged(auth, (user) => {
                hideLoading();

                if (user) {
                    document.getElementById('login-view').classList.add('hidden');
                    document.getElementById('dashboard-view').classList.remove('hidden');
                    loadOrders();
                } else {
                    document.getElementById('login-view').classList.remove('hidden');
                    document.getElementById('dashboard-view').classList.add('hidden');
                }
            });
        });
        function toggleAdminPassword(btnEl) {
            const input = document.getElementById('admin-pass');
            const icon = btnEl.querySelector('i');
            
            if (input.type === 'password') {
                input.type = 'text';
                icon.classList.remove('fa-eye');
                icon.classList.add('fa-eye-slash');
            } else {
                input.type = 'password';
                icon.classList.remove('fa-eye-slash');
                icon.classList.add('fa-eye');
            }
        }
        function adminLogin() {
            const email = document.getElementById('admin-email').value;
            const pass = document.getElementById('admin-pass').value;
            const errorEl = document.getElementById('login-error');
            
            // Tampilkan loading saat tombol login diklik
            showLoading();
            
            window.firebaseAdmin.signInWithEmailAndPassword(window.firebaseAdmin.auth, email, pass)
                .then(() => {
                    errorEl.classList.add('hidden');
                    // HAPUS KOLOM EMAIL & PASSWORD begitu login berhasil
                    document.getElementById('admin-email').value = '';
                    document.getElementById('admin-pass').value = '';
                })
                .catch(err => {
                    // Sembunyikan loading jika gagal login
                    hideLoading();
                    
                    let msg = "Terjadi error. Cek console (F12).";
                    if (err.code === 'auth/user-not-found') msg = "Akun email ini belum terdaftar di Firebase Auth.";
                    else if (err.code === 'auth/wrong-password' || err.code === 'auth/invalid-credential') msg = "Password yang Anda masukkan salah.";
                    else if (err.code === 'auth/invalid-email') msg = "Format email tidak valid.";
                    else if (err.code === 'auth/network-request-failed') msg = "Jaringan internet bermasalah.";
                    else if (err.code === 'auth/too-many-requests') msg = "Terlalu banyak percobaan login gagal. Coba lagi nanti.";
                    
                    errorEl.textContent = msg;
                    errorEl.classList.remove('hidden');
                });
        }
        function adminLogout() {
            // HAPUS KOLOM EMAIL & PASSWORD saat logout (jaga-jaga jika ada sisa teks)
            document.getElementById('admin-email').value = '';
            document.getElementById('admin-pass').value = '';
            
            window.firebaseAdmin.signOut(window.firebaseAdmin.auth);
        }
        function loadOrders() {
            const { db, collection, query, onSnapshot } = window.firebaseAdmin;
            const tbody = document.getElementById('orders-table-body');
            
            // Tampilkan loading saat pertama kali memuat data
            if (allOrders.length === 0) showLoading();

            const q = query(collection(db, "Riwayat_Pesanan"));
            
            onSnapshot(q, (snapshot) => {
                allOrders = [];
                snapshot.forEach((doc) => {
                    allOrders.push({ id: doc.id, data: doc.data() });
                });

                // Sortir manual berdasarkan tanggal karena format tanggal string
                allOrders.sort((a, b) => {
                    let dateA = a.data.transactionDate || '';
                    let dateB = b.data.transactionDate || '';
                    return dateB.localeCompare(dateA);
                });

                renderTable(allOrders);
                
                // Sembunyikan animasi loading begitu data selesai dirender
                hideLoading();
            }, (error) => {
                console.error("Error fetching orders: ", error);
                tbody.innerHTML = `<tr><td colspan="7" class="text-center text-red-400 py-8">Gagal memuat data. Cek Security Rules Anda.</td></tr>`;
                hideLoading();
            });
        }
        function renderTable(orders) {
            const tbody = document.getElementById('orders-table-body');
            
            if (orders.length === 0) {
                tbody.innerHTML = `<tr><td colspan="7" class="text-center text-gray-500 py-8">Tidak ada transaksi ditemukan.</td></tr>`;
                return;
            }

            tbody.innerHTML = orders.map(order => {
                const d = order.data;
                let statusClass = 'badge-yellow';
                if (d.status === 'Berhasil' || d.status === 'Berhasil Ditinjau') statusClass = 'badge-green';
                else if (d.status === 'Gagal' || d.status === 'Refund') statusClass = 'badge-red';
                else if (d.status === 'Unit Belum Diserahkan' || d.status === 'Sedang Ditinjau') statusClass = 'badge-orange';
                else if (d.status === 'Sedang Dalam Pengiriman') statusClass = 'badge-blue';

                let itemsText = d.items ? d.items.map(item => `${item.name} (x${item.quantity})`).join(', ') : '-';
                if (itemsText.length > 50) itemsText = itemsText.substring(0, 50) + '...';

                const total = d.total ? `Rp ${d.total.toLocaleString('id-ID')}` : 'Rp 0';

                return `
                    <tr>
                        <td class="text-gray-400 whitespace-nowrap text-xs">${d.transactionDate || '-'}</td>
                        <td class="font-mono text-xs whitespace-nowrap">${order.id}</td>
                        <td class="whitespace-nowrap">
                            <div class="font-medium text-sm">${d.userName || '-'}</div>
                            <div class="text-xs text-gray-500">${d.userTelp || '-'}</div>
                        </td>
                        <td class="text-xs text-gray-400 max-w-xs">${itemsText}</td>
                        <td class="font-bold whitespace-nowrap text-sm">${total}</td>
                        <td><span class="badge ${statusClass} whitespace-nowrap">${d.status || 'Menunggu'}</span></td>
                        <td class="whitespace-nowrap">
                            <button onclick="openEditModal('${order.id}')" class="btn-outline text-xs px-3 py-1.5">
                                <i class="fa-solid fa-pen mr-1"></i> Edit
                            </button>
                        </td>
                    </tr>
                `;
            }).join('');
        }
        function filterTable() {
            const searchTerm = document.getElementById('search-input').value.toLowerCase();
            const statusFilter = document.getElementById('filter-status').value;
            const filtered = allOrders.filter(order => {
            const d = order.data;
            const matchesSearch = (order.id.toLowerCase().includes(searchTerm) || (d.userName || '').toLowerCase().includes(searchTerm));
            const matchesStatus = statusFilter ? (d.status === statusFilter) : true;
                return matchesSearch && matchesStatus;
            });

            renderTable(filtered);
        }
                function openEditModal(docId) {
            currentDocId = docId;
            const orderObj = allOrders.find(o => o.id === docId);
            if (!orderObj) return;
            
            const d = orderObj.data;
            
            document.getElementById('modal-order-id').value = docId;
            document.getElementById('modal-userName').value = d.userName || '';
            document.getElementById('modal-userTelp').value = d.userTelp || '';
            document.getElementById('modal-transactionDate').value = d.transactionDate || '';
            document.getElementById('modal-paymentMethod').value = d.paymentMethod || '';
            document.getElementById('modal-subtotal').value = d.subtotal || 0;
            document.getElementById('modal-shippingCost').value = d.shippingCost || 0;
            document.getElementById('modal-promoDiscount').value = d.promoDiscount || 0;
            document.getElementById('modal-total').value = d.total || 0;
            document.getElementById('modal-status').value = d.status || 'Menunggu Pembayaran';
            document.getElementById('modal-shippingMode').value = d.shippingMode || '';
            document.getElementById('modal-address').value = d.address || '';
            document.getElementById('modal-promoCode').value = d.promoCode || '';
            
            // Buat Form Dinamis untuk Daftar Barang
            const itemsContainer = document.getElementById('modal-items-container');
            itemsContainer.innerHTML = ''; // Kosongkan dulu
            
            if (d.items && d.items.length > 0) {
                d.items.forEach((item, idx) => {
                    // Cek apakah ada ID Pelanggan untuk barang ini
                    const idPels = (d.idPelanggan && d.idPelanggan[idx]) ? d.idPelanggan[idx].join(', ') : '';
                    
                    itemsContainer.innerHTML += `
                        <div class="p-3 bg-[#0e0e0e] rounded-lg border border-[#2a2a2a]">
                            <div class="mb-2 text-[11px] text-gray-500">Barang ${idx + 1}</div>
                            <div class="mb-2">
                                <label class="text-[10px] text-gray-500 mb-1 block">Nama Barang</label>
                                <input type="text" class="form-input modal-item-name" data-idx="${idx}" value="${(item.name || '').replace(/"/g, '&quot;')}">
                            </div>
                            <div class="grid grid-cols-2 gap-2 mb-2">
                                <div>
                                    <label class="text-[10px] text-gray-500 mb-1 block">Harga</label>
                                    <input type="number" class="form-input modal-item-price" data-idx="${idx}" value="${item.price || 0}">
                                </div>
                                <div>
                                    <label class="text-[10px] text-gray-500 mb-1 block">Qty</label>
                                    <input type="number" class="form-input modal-item-qty" data-idx="${idx}" value="${item.quantity || 1}">
                                </div>
                            </div>
                            ${idPels !== '' ? `
                            <div class="mt-2 pt-2 border-t border-[#222]">
                                <label class="text-[10px] text-gray-500 mb-1 block">ID Pelanggan (Pisahkan dengan Enter/baris baru jika lebih dari 1)</label>
                                <textarea class="form-input modal-item-idpel" data-idx="${idx}" rows="3" style="resize: vertical;">${idPels}</textarea>
                            </div>
                            ` : ''}
                        </div>
                    `;
                });
            } else {
                itemsContainer.innerHTML = '<p class="text-xs text-gray-500">Tidak ada barang.</p>';
            }
            
            document.getElementById('edit-modal').classList.remove('hidden');
        }
        function closeEditModal() {
            document.getElementById('edit-modal').classList.add('hidden');
            currentDocId = null;
        }
                async function saveDataChange() {
            if (!currentDocId) return;
            
            try {
                // 1. Kumpulkan Data Barang & ID Pelanggan dari Form Dinamis
                let updatedItems = [];
                let updatedIdPelanggan = {};
                
                document.querySelectorAll('.modal-item-name').forEach((nameInput) => {
                    const idx = nameInput.dataset.idx;
                    const priceInput = document.querySelector(`.modal-item-price[data-idx="${idx}"]`);
                    const qtyInput = document.querySelector(`.modal-item-qty[data-idx="${idx}"]`);
                    const idpelInput = document.querySelector(`.modal-item-idpel[data-idx="${idx}"]`);
                    
                    // Masukkan ke Array Barang
                    updatedItems.push({
                        name: nameInput.value,
                        price: parseInt(priceInput.value) || 0,
                        quantity: parseInt(qtyInput.value) || 1
                    });

                    // Jika ada ID Pelanggan, masukkan ke Object (Pisahkan berdasarkan baris baru/Enter)
                    if (idpelInput) {
                        const ids = idpelInput.value.split('\n').map(id => id.trim()).filter(id => id !== '');
                        if (ids.length > 0) {
                            updatedIdPelanggan[idx] = ids;
                        }
                    }
                });

                // 2. Ambil semua nilai dari form utama
                const updatedData = {
                    userName: document.getElementById('modal-userName').value,
                    userTelp: document.getElementById('modal-userTelp').value,
                    transactionDate: document.getElementById('modal-transactionDate').value,
                    paymentMethod: document.getElementById('modal-paymentMethod').value,
                    subtotal: parseInt(document.getElementById('modal-subtotal').value) || 0,
                    shippingCost: parseInt(document.getElementById('modal-shippingCost').value) || 0,
                    promoDiscount: parseInt(document.getElementById('modal-promoDiscount').value) || 0,
                    total: parseInt(document.getElementById('modal-total').value) || 0,
                    status: document.getElementById('modal-status').value,
                    shippingMode: document.getElementById('modal-shippingMode').value,
                    address: document.getElementById('modal-address').value,
                    promoCode: document.getElementById('modal-promoCode').value,
                    items: updatedItems,
                    idPelanggan: updatedIdPelanggan
                };

                const { db, doc, updateDoc } = window.firebaseAdmin;
                const orderRef = doc(db, "Riwayat_Pesanan", currentDocId);
                
                await updateDoc(orderRef, updatedData);
                
                showToast("Data transaksi berhasil diperbarui!");
                closeEditModal();
            } catch (err) {
                console.error("Error updating data: ", err);
                alert("Gagal menyimpan data. Mohon cek kembali isian form.");
            }
        }
        // --- FUNGSI TAB NAVIGASI ---
        function switchTab(tabName) {
            if (tabName === 'orders') {
                document.getElementById('view-orders').classList.remove('hidden');
                document.getElementById('view-users').classList.add('hidden');
                document.getElementById('tab-orders').className = 'btn-pk text-sm';
                document.getElementById('tab-users').className = 'btn-outline text-sm';
            } else {
                document.getElementById('view-orders').classList.add('hidden');
                document.getElementById('view-users').classList.remove('hidden');
                document.getElementById('tab-orders').className = 'btn-outline text-sm';
                document.getElementById('tab-users').className = 'btn-pk text-sm';
                
                // Muat data pengguna hanya jika tabel masih kosong
                const tbody = document.getElementById('users-table-body');
                if (tbody.innerHTML.includes('Klik tab ini')) {
                    loadUsers();
                }
            }
        }

                // --- FUNGSI AMBIL DATA PENGGUNA (REAL-TIME) ---
        function loadUsers() {
            const tbody = document.getElementById('users-table-body');
            tbody.innerHTML = `<tr><td colspan="5" class="text-center text-gray-500 py-8">Memuat data pengguna...</td></tr>`;
            
            showLoading();
            try {
                const { db, collection, query, onSnapshot } = window.firebaseAdmin;
                const q = query(collection(db, "users"));
                
                // Gunakan onSnapshot agar data pengguna real-time
                onSnapshot(q, (snapshot) => {
                    let usersData = [];
                    snapshot.forEach((doc) => {
                        usersData.push(doc.data());
                    });

                    // Urutkan berdasarkan waktu terakhir online (LastSeen terbaru di atas)
                    usersData.sort((a, b) => {
                        let timeA = a.LastSeen || '';
                        let timeB = b.LastSeen || '';
                        return timeB.localeCompare(timeA);
                    });

                    if (usersData.length === 0) {
                        tbody.innerHTML = `<tr><td colspan="5" class="text-center text-gray-500 py-8">Tidak ada data pengguna.</td></tr>`;
                        hideLoading();
                        return;
                    }

                    tbody.innerHTML = usersData.map(d => {
                        // Format waktu pembuatan akun
                        let createdDate = '-';
                        if (d.createdAt) {
                            try {
                                createdDate = new Date(d.createdAt).toLocaleString('id-ID', { day: '2-digit', month: '2-digit', year: 'numeric', hour: '2-digit', minute: '2-digit' });
                            } catch(e) {
                                createdDate = d.createdAt;
                            }
                        }

                                            return `
                        <tr>
                            <td class="text-xs text-gray-300 whitespace-nowrap">${d.email || '-'}</td>
                            <td class="text-xs text-gray-300 whitespace-nowrap">${d.nama || '-'}</td>
                            <td class="text-xs text-gray-400 whitespace-nowrap">${createdDate}</td>
                            <td class="text-xs text-gray-400 whitespace-nowrap">${d.LastSeen || '-'}</td>
                            <td class="text-xs text-gray-300 whitespace-nowrap">${d.telp || '-'}</td>
                        </tr>
                    `;
                    }).join('');

                    // Sembunyikan loading setelah data pertama kali selesai dimuat
                    hideLoading();

                }, (error) => {
                    console.error("Error fetching users: ", error);
                    tbody.innerHTML = `<tr><td colspan="5" class="text-center text-red-400 py-8">Gagal memuat data. Cek Security Rules.</td></tr>`;
                    hideLoading();
                });

            } catch (err) {
                console.error("Error setup users listener: ", err);
                hideLoading();
            }
        }
        function showToast(msg) {
            const t = document.createElement('div');
            t.className = 'fixed top-4 left-1/2 -translate-x-1/2 bg-green-500 text-white px-6 py-3 rounded-lg shadow-lg z-50 font-medium text-sm';
            t.textContent = msg;
            document.body.appendChild(t);
            setTimeout(() => t.remove(), 3000);
        }
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('sw.js').catch(err => console.log('SW Admin gagal:', err));
            });
        }
    </script>
