    <script>
        let currentDocId = null;
        let allOrders = [];
        let pendingOrderId = null;
        let isInitialLoadOrders = true;
        let allBanners = [];

        function showLoading() { document.getElementById('loading-overlay').classList.remove('hidden'); }
        // --- AUTO REFRESH PWA ADMIN ---
const BACKGROUND_LIMIT = 25 * 60 * 1000; // 25 menit (Berpindah aplikasi di HP/Desktop)
const DESKTOP_IDLE_LIMIT = 2 * 60 * 1000; // 2 menit (Diam menatap layar di Desktop)

// Deteksi perangkat (Mobile dikecualikan dari aturan idle 2 menit)
const isMobile = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent);

let hiddenTime = null;
let lastInteractionTime = Date.now();

// 1. Catat setiap kali Admin menggerakkan mouse, mengetik, atau mengklik
['mousemove', 'keydown', 'click', 'scroll', 'touchstart'].forEach(eventName => {
    document.addEventListener(eventName, () => {
        lastInteractionTime = Date.now();
    }, { passive: true });
});

// 2. Fungsi untuk mencatat waktu saat aplikasi kehilangan fokus
function handleAppHide() {
    if (hiddenTime === null) {
        hiddenTime = Date.now();
    }
}

// 3. Fungsi untuk mengecek waktu saat aplikasi kembali aktif
function handleAppShow() {
    if (hiddenTime !== null) {
        const timeAway = Date.now() - hiddenTime;
        if (timeAway >= BACKGROUND_LIMIT) {
            console.log('Kembali dari background (25 menit), merefresh data...');
            window.location.reload();
        }
        hiddenTime = null;
    }
    lastInteractionTime = Date.now(); // Reset timer idle
}

// Mendengarkan perubahan visibility (Standar Web)
document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'hidden') handleAppHide();
    else handleAppShow();
});

// Mendengarkan focus/blur (Cadangan khusus untuk Android PWA Standalone)
window.addEventListener('blur', handleAppHide);
window.addEventListener('focus', handleAppShow);

// 4. Fungsi Khusus Desktop: Cek idle (Admin menatap layar tanpa sentuh mouse/keyboard)
setInterval(() => {
    if (isMobile) return; // <-- Hanya berjalan di Desktop

    // Jangan refresh jika Admin sedang membuka form Edit
    const isEditing = !document.getElementById('edit-banner-modal').classList.contains('hidden') || 
                       !document.getElementById('edit-modal').classList.contains('hidden');
    
    if (isEditing) {
        lastInteractionTime = Date.now();
        return;
    }

    const idleTime = Date.now() - lastInteractionTime;

    if (idleTime >= DESKTOP_IDLE_LIMIT) {
        console.log('Desktop idle 2 menit tercapai, merefresh data transaksi...');
        window.location.reload();
    }
}, 5000); // Cek status idle setiap 5 detik
// --- AKHIR KODE AUTO REFRESH ---
        function hideLoading() { document.getElementById('loading-overlay').classList.add('hidden'); }

        window.addEventListener('firebase-admin-ready', function() {
            const { auth, onAuthStateChanged } = window.firebaseAdmin;
            showLoading();
            onAuthStateChanged(auth, (user) => {
                hideLoading();
                if (user) {
                    document.getElementById('login-view').classList.add('hidden');
                    document.getElementById('dashboard-view').classList.remove('hidden');
                    const urlParams = new URLSearchParams(window.location.search);
                    const orderIdFromUrl = urlParams.get('orderId');
                    if (orderIdFromUrl) pendingOrderId = String(orderIdFromUrl);
                    loadOrders();
                } else {
                    document.getElementById('login-view').classList.remove('hidden');
                    document.getElementById('dashboard-view').classList.add('hidden');
                }
            });
        });

        function toggleAdminPassword(btnEl) {
            const input = document.getElementById('admin-pass');
            const icon = btnEl.querySelector('i');
            if (input.type === 'password') { input.type = 'text'; icon.classList.replace('fa-eye', 'fa-eye-slash'); } 
            else { input.type = 'password'; icon.classList.replace('fa-eye-slash', 'fa-eye'); }
        }

        async function setupFCM() {
            const { messaging, getToken, db, doc, setDoc, onMessage } = window.firebaseAdmin;
            try {
                const registration = await navigator.serviceWorker.register('firebase-messaging-sw.js');
                await navigator.serviceWorker.ready;
                const currentToken = await getToken(messaging, { vapidKey: 'BPduMClEXKWN2l3Z8aTpsyJ3b5S5z2lS31NEp48cwczzAueuPTS_aYZ8MUTQ9NvqsuFmJCH6d0gFexcSG9xpWK0', serviceWorkerRegistration: registration });
                if (currentToken) await setDoc(doc(db, "admin_tokens", currentToken), { token: currentToken });
                onMessage(messaging, (payload) => {
                    const orderId = payload.data?.orderId || '';
                    const total = payload.data?.total ? parseInt(payload.data.total) : 0;
                    const userName = payload.data?.userName || 'Pelanggan';
                    let items = [];
                    try { items = JSON.parse(payload.data?.items || '[]'); } catch(e) {}
                    showOrderNotification({ orderId, total, userName, items });
                });
            } catch (err) { console.error('Gagal ambil FCM token:', err); }
        }

        function adminLogin() {
            const email = document.getElementById('admin-email').value;
            const pass = document.getElementById('admin-pass').value;
            const errorEl = document.getElementById('login-error');
            showLoading();
            window.firebaseAdmin.signInWithEmailAndPassword(window.firebaseAdmin.auth, email, pass)
                .then(() => {
                    errorEl.classList.add('hidden');
                    document.getElementById('admin-email').value = '';
                    document.getElementById('admin-pass').value = '';
                    requestNotificationPermission();
                    setupFCM();
                })
                .catch(err => {
                    hideLoading();
                    let msg = "Terjadi error. Cek console (F12).";
                    if (err.code === 'auth/user-not-found') msg = "Akun email ini belum terdaftar.";
                    else if (err.code === 'auth/wrong-password' || err.code === 'auth/invalid-credential') msg = "Password yang Anda masukkan salah.";
                    else if (err.code === 'auth/invalid-email') msg = "Format email tidak valid.";
                    errorEl.textContent = msg;
                    errorEl.classList.remove('hidden');
                });
        }

        function adminLogout() {
            document.getElementById('admin-email').value = '';

        function loadOrders() {
            const { db, collection, query, onSnapshot } = window.firebaseAdmin;
            const tbody = document.getElementById('orders-table-body');
            if (allOrders.length === 0) showLoading();
            const q = query(collection(db, "Riwayat_Pesanan"));
            onSnapshot(q, (snapshot) => {
                allOrders = [];
                snapshot.forEach((doc) => allOrders.push({ id: doc.id, data: doc.data() }));
                function parseDate(dateStr) {
                    if (!dateStr) return 0;
                    let parts = dateStr.match(/(\d{1,2})\/(\d{1,2})\/(\d{4}),?\s*(\d{1,2})[:.](\d{1,2})(?:[:.](\d{1,2}))?/);
                    if (parts) return new Date(parts[3], parts[2] - 1, parts[1], parts[4] || 0, parts[5] || 0, parts[6] || 0).getTime();
                    let dateObj = new Date(dateStr);
                    return isNaN(dateObj) ? 0 : dateObj.getTime();
                }
                allOrders.sort((a, b) => parseDate(b.data.transactionDate) - parseDate(a.data.transactionDate));
                renderTable(allOrders);
                hideLoading();
                isInitialLoadOrders = false;
                if (pendingOrderId) {
                    const orderObj = allOrders.find(o => o.id === pendingOrderId);
                    if (orderObj) { openEditModal(pendingOrderId); pendingOrderId = null; }
                }
            }, (error) => {
                tbody.innerHTML = `<tr><td colspan="7" class="text-center text-red-400 py-8">Gagal memuat data.</td></tr>`;
                hideLoading();
            });
        }

        function renderTable(orders) {
            const tbody = document.getElementById('orders-table-body');
            if (orders.length === 0) { tbody.innerHTML = `<tr><td colspan="7" class="text-center text-gray-500 py-8">Tidak ada transaksi ditemukan.</td></tr>`; return; }
            tbody.innerHTML = orders.map(order => {
                const d = order.data;
                let statusClass = 'badge-yellow';
                if (d.status === 'Berhasil' || d.status === 'Berhasil Ditinjau') statusClass = 'badge-green';
                else if (d.status === 'Gagal' || d.status === 'Refund') statusClass = 'badge-red';
                else if (d.status === 'Unit Belum Diserahkan' || d.status === 'Sedang Ditinjau') statusClass = 'badge-orange';
                else if (d.status === 'Sedang Dalam Pengiriman') statusClass = 'badge-blue';
                let itemsText = d.items ? d.items.map(item => `${item.name} (x${item.quantity})`).join(', ') : '-';
                if (itemsText.length > 50) itemsText = itemsText.substring(0, 50) + '...';
                const total = d.total ? `Rp ${d.total.toLocaleString('id-ID')}` : 'Rp 0';
                return `
                    <tr>
                        <td class="text-gray-400 whitespace-nowrap text-xs">${d.transactionDate || '-'}</td>
                        <td class="font-mono text-xs whitespace-nowrap">${order.id}</td>
                        <td class="whitespace-nowrap">
                            <div class="font-medium text-sm">${d.userName || '-'}</div>
                            <div class="text-xs text-gray-500">${d.userTelp || '-'}</div>
                        </td>
                        <td class="text-xs text-gray-400 max-w-xs">${itemsText}</td>
                        <td class="font-bold whitespace-nowrap text-sm">${total}</td>
                        <td><span class="badge ${statusClass} whitespace-nowrap">${d.status || 'Menunggu'}</span></td>
                        <td class="whitespace-nowrap">
                            <button onclick="openEditModal('${order.id}')" class="btn-outline text-xs px-3 py-1.5">
                                <i class="fa-solid fa-pen mr-1"></i> Edit
                            </button>
                        </td>
                    </tr>`;
            }).join('');
        }

        function filterTable() {
            const searchTerm = document.getElementById('search-input').value.toLowerCase();
            const statusFilter = document.getElementById('filter-status').value;
            const filtered = allOrders.filter(order => {
                const d = order.data;
                const matchesSearch = (order.id.toLowerCase().includes(searchTerm) || (d.userName || '').toLowerCase().includes(searchTerm));
                const matchesStatus = statusFilter ? (d.status === statusFilter) : true;
                return matchesSearch && matchesStatus;
            });
            renderTable(filtered);
        }

        async function saveDataChange() {
            if (!currentDocId) return;
            try {
                let updatedItems = [];
                let updatedIdPelanggan = {};
                document.querySelectorAll('.modal-item-name').forEach((nameInput) => {
                    const idx = nameInput.dataset.idx;
                    const priceInput = document.querySelector(`.modal-item-price[data-idx="${idx}"]`);
                    const qtyInput = document.querySelector(`.modal-item-qty[data-idx="${idx}"]`);
                    const idpelInput = document.querySelector(`.modal-item-idpel[data-idx="${idx}"]`);
                    updatedItems.push({ name: nameInput.value, price: parseInt(priceInput.value) || 0, quantity: parseInt(qtyInput.value) || 1 });
                    if (idpelInput) {
                        const ids = idpelInput.value.split('\n').map(id => id.trim()).filter(id => id !== '');
                        if (ids.length > 0) updatedIdPelanggan[idx] = ids;
                    }
                });
                const updatedData = {
                    userName: document.getElementById('modal-userName').value,
                    userTelp: document.getElementById('modal-userTelp').value,
                    transactionDate: document.getElementById('modal-transactionDate').value,
                    paymentMethod: document.getElementById('modal-paymentMethod').value,
                    subtotal: parseInt(document.getElementById('modal-subtotal').value) || 0,
                    shippingCost: parseInt(document.getElementById('modal-shippingCost').value) || 0,
                    promoDiscount: parseInt(document.getElementById('modal-promoDiscount').value) || 0,
                    total: parseInt(document.getElementById('modal-total').value) || 0,
                    status: document.getElementById('modal-status').value,
                    shippingMode: document.getElementById('modal-shippingMode').value,
                    address: document.getElementById('modal-address').value,
                    promoCode: document.getElementById('modal-promoCode').value,
                    items: updatedItems,
                    idPelanggan: updatedIdPelanggan
                };
                const { db, doc, updateDoc } = window.firebaseAdmin;
                await updateDoc(doc(db, "Riwayat_Pesanan", currentDocId), updatedData);
                showToast("Data transaksi berhasil diperbarui!");
                closeEditModal();
            } catch (err) { alert("Gagal menyimpan data. Mohon cek kembali isian form."); }
        }

                function renderBanners() {
            const listEl = document.getElementById('banners-list');

            // Urutkan array berdasarkan 'order' agar selalu sinkron
            allBanners.sort((a, b) => {
                const orderA = a.data.order || 999;
                const orderB = b.data.order || 999;
                return orderA - orderB;
            });

            if (allBanners.length === 0) {
                listEl.innerHTML = '<p class="text-gray-500 text-sm col-span-full">Belum ada banner. Klik "Tambah Banner" untuk membuat baru.</p>';
                return;
            }

            // Deteksi perangkat Mobile
            const isMobile = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent);

            listEl.innerHTML = allBanners.map((b, index) => {
                const orderNum = index + 1;
                const orderStr = String(orderNum).padStart(2, '0');
                const isActive = b.data.active;
                const typeText = b.data.type === 'info' ? 'Informasi' : 'Promosi';
                
                // Logika Badge Status (Aktif / Terjadwal / Nonaktif)
                let statusBadge = '';
                if (!isActive) {
                    statusBadge = `<span class="bg-gray-500 text-white text-[10px] font-bold px-2 py-0.5 rounded-md shadow-lg">Nonaktif</span>`;
                } else {
                    let isScheduled = false;
                    if (b.data.scheduleStartTime) {
                        const start = new Date(b.data.scheduleStartTime);
                        if (start > new Date()) {
                            isScheduled = true; // Jika jam mulai belum tercapai, berarti Terjadwal
                        }
                    }
                    
                    if (isScheduled) {
                        statusBadge = `<span class="bg-yellow-500 text-white text-[10px] font-bold px-2 py-0.5 rounded-md shadow-lg">Terjadwal</span>`;
                    } else {
                        // Jika sudah mulai (live) atau tidak ada jadwal, tampilkan Aktif
                        statusBadge = `<span class="bg-green-500 text-white text-[10px] font-bold px-2 py-0.5 rounded-md shadow-lg">Aktif</span>`;
                    }
                }
                const mobileOrderBtns = `
                    <div class="flex gap-1 md:hidden">
                        <button onclick="moveBanner('${b.id}', -1)" ${index === 0 ? 'disabled' : ''} class="bg-dk-600 text-white text-xs px-2 py-1 rounded-md ${index === 0 ? 'opacity-30' : 'hover:bg-pk'}">
                            <i class="fa-solid fa-arrow-up"></i>
                        </button>
                        <button onclick="moveBanner('${b.id}', 1)" ${index === allBanners.length - 1 ? 'disabled' : ''} class="bg-dk-600 text-white text-xs px-2 py-1 rounded-md ${index === allBanners.length - 1 ? 'opacity-30' : 'hover:bg-pk'}">
                            <i class="fa-solid fa-arrow-down"></i>
                        </button>
                    </div>
                `;

                return `
                    <div class="card p-3 flex flex-col gap-2 relative" data-id="${b.id}">
                        <div class="relative">
                            <img src="${b.data.imageUrl || ''}" class="w-full h-32 object-cover rounded-lg bg-dk-700">
                            <div class="absolute top-2 left-2 flex gap-1">
                                <span class="bg-pk text-white text-[10px] font-bold px-2 py-0.5 rounded-md shadow-lg">${orderStr}</span>
                                ${statusBadge}
                            </div>
                            <!-- Ikon Grip hanya muncul di Desktop -->
                            <div class="absolute top-2 right-2 bg-black/50 text-white text-[10px] font-bold p-1 rounded-md cursor-grab hidden md:block">
                                <i class="fa-solid fa-grip-vertical"></i>
                            </div>
                        </div>

                            <h3 class="font-bold text-sm">${b.data.title || 'Tanpa Judul'}</h3>
                            <p class="text-xs text-gray-500 mt-0.5">${typeText}</p>
                        </div>
                        <div class="flex justify-between items-center mt-1">
                            <button onclick="openEditBannerModal('${b.id}')" class="btn-outline text-xs py-1.5 flex-1 mr-2">
                                <i class="fa-solid fa-pen mr-1"></i> Edit
                            </button>
                            ${mobileOrderBtns}
                        </div>
                    </div>
                `;
            }).join('');

            // Inisialisasi Drag and Drop (HANYA untuk Desktop)
            if (window.Sortable && !isMobile) {
                Sortable.create(listEl, {
                    animation: 150,
                    ghostClass: 'opacity-30',
                    onEnd: function (evt) {
                        updateBannerOrder();
                    }
                });
            }
        }

        // Fungsi baru khusus Mobile untuk pindah posisi banner
        async function moveBanner(id, direction) {
            const currentIndex = allBanners.findIndex(b => b.id === id);
            const targetIndex = currentIndex + direction;
            
            if (targetIndex < 0 || targetIndex >= allBanners.length) return;

            // Tukar posisi di array lokal
            const temp = allBanners[currentIndex];
            allBanners[currentIndex] = allBanners[targetIndex];
            allBanners[targetIndex] = temp;

            // Update nomor urut di memori lokal
            allBanners.forEach((b, i) => {
                b.data.order = i + 1;
            });

            renderBanners(); // Render ulang

            // Simpan ke Firestore
            try {
                const { db, doc, writeBatch } = window.firebaseAdmin;
                const batch = writeBatch(db);
                
                allBanners.forEach((b) => {
                    const bannerRef = doc(db, "banners", b.id);
                    batch.update(bannerRef, { order: b.data.order });
                });
                
                await batch.commit();
                showToast("Urutan banner berhasil diperbarui!");
            } catch (err) {
                console.error("Gagal menyimpan urutan:", err);
            }
        }

                // Fungsi untuk menyimpan urutan hasil drag and drop ke Firestore
        async function updateBannerOrder() {
            const listEl = document.getElementById('banners-list');
            const newOrderIds = Array.from(listEl.children).map(child => child.dataset.id);
            
            // 1. Update data 'order' di memori lokal (JavaScript) SECARA LANGSUNG
            // Ini mencegah onSnapshot mereset tampilan saat data server belum berubah
            for (let i = 0; i < newOrderIds.length; i++) {
                const id = newOrderIds[i];
                const bannerObj = allBanners.find(b => b.id === id);
                if (bannerObj) {
                    bannerObj.data.order = i + 1; // Set urutan baru (1, 2, 3...)
                }
            }
            
            // 2. Render ulang tampilan menggunakan data lokal yang baru diupdate
            renderBanners();
            
            // 3. Simpan urutan baru ke Firestore menggunakan Batch Write
            try {
                const { db, doc, writeBatch } = window.firebaseAdmin;
                const batch = writeBatch(db);
                
                for (let i = 0; i < newOrderIds.length; i++) {
                    const id = newOrderIds[i];
                    const bannerRef = doc(db, "banners", id);
                    batch.update(bannerRef, { order: i + 1 });
                }
                
                await batch.commit();
                showToast("Urutan banner berhasil diperbarui!");
            } catch (err) {
                console.error("Gagal menyimpan urutan:", err);
                alert("Terjadi kesalahan saat menyimpan urutan.");
            }
        }

function openEditBannerModal(id = null) {
    const deleteBtn = document.getElementById('delete-banner-btn');
    
    // Fungsi bantu untuk mengisi input date & time dari format ISO
    const fillScheduleInputs = (isoString, dateId, timeId) => {
        if (isoString) {
            const dt = new Date(isoString);
            const yyyy = dt.getFullYear();
            const mm = String(dt.getMonth() + 1).padStart(2, '0');
            const dd = String(dt.getDate()).padStart(2, '0');
            const hh = String(dt.getHours()).padStart(2, '0');
            const min = String(dt.getMinutes()).padStart(2, '0');
            document.getElementById(dateId).value = `${yyyy}-${mm}-${dd}`;
            document.getElementById(timeId).value = `${hh}:${min}`;
        } else {
            document.getElementById(dateId).value = '';
            document.getElementById(timeId).value = '';
        }
    };

    if (id) {
        // --- MODE EDIT BANNER LAMA ---
        const b = allBanners.find(x => x.id === id);
        if (!b) return;
        document.getElementById('banner-doc-id').value = id;
        document.getElementById('banner-type').value = b.data.type || 'promo';
        document.getElementById('banner-imageUrl').value = b.data.imageUrl || '';
        document.getElementById('banner-title').value = b.data.title || '';
        
        fillScheduleInputs(b.data.scheduleStartTime, 'banner-scheduleStartDate', 'banner-scheduleStartTime');
        fillScheduleInputs(b.data.scheduleEndTime, 'banner-scheduleEndDate', 'banner-scheduleEndTime');

        // --- SEMBUNYIKAN JADWAL JIKA STATUSNYA SUDAH AKTIF/LIVE ---
        const scheduleWrapper = document.getElementById('schedule-wrapper');
        const now = new Date();
        let isLive = false;
        
        if (b.data.active) {
            let isScheduled = false;
            if (b.data.scheduleStartTime) {
                const start = new Date(b.data.scheduleStartTime);
                if (start > now) {
                    isScheduled = true; // Jika ada jadwal mulai tapi belum waktunya, berarti "Terjadwal"
                }
            }
            
            if (!isScheduled) {
                isLive = true; // Jika aktif dan BUKAN terjadwal, berarti sudah LIVE
            }
        }
        
        if (isLive) {
            scheduleWrapper.classList.add('hidden'); // Sembunyikan field jadwal karena sudah live
        } else {
            scheduleWrapper.classList.remove('hidden'); // Tampilkan field jadwal jika masih terjadwal/nonaktif
        }

        document.getElementById('banner-label-periode').value = b.data.labelPeriode || 'Periode';
        document.getElementById('banner-periode').value = b.data.periode || '';
        document.getElementById('banner-label-hadiah').value = b.data.labelHadiah || 'Total Hadiah / Keuntungan';
        document.getElementById('banner-hadiah').value = b.data.hadiah || '';
        document.getElementById('banner-label-pengumuman').value = b.data.labelPengumuman || 'Pemenang / Pengumuman';
        document.getElementById('banner-pengumuman').value = b.data.pengumuman || '';
        document.getElementById('banner-label-caraIkut').value = b.data.labelCaraIkut || 'Cara Mengikuti';
        document.getElementById('banner-caraIkut').value = (b.data.caraIkut || []).join('\n');

        document.getElementById('banner-isiPesan').value = b.data.isiPesan || '';
        document.getElementById('banner-active').checked = b.data.active || false;
        deleteBtn.classList.remove('hidden');
    } else {
        // --- MODE TAMBAH BANNER BARU ---
        document.getElementById('banner-doc-id').value = '';
        document.getElementById('banner-type').value = 'promo';
        document.getElementById('banner-imageUrl').value = '';
        document.getElementById('banner-title').value = '';
        
        fillScheduleInputs(null, 'banner-scheduleStartDate', 'banner-scheduleStartTime');
        fillScheduleInputs(null, 'banner-scheduleEndDate', 'banner-scheduleEndTime');
        
        // Pastikan field jadwal terlihat saat membuat banner baru
        document.getElementById('schedule-wrapper').classList.remove('hidden');
        
        document.getElementById('banner-label-periode').value = 'Periode';
        document.getElementById('banner-periode').value = '';
        document.getElementById('banner-label-hadiah').value = 'Total Hadiah / Keuntungan';
        document.getElementById('banner-hadiah').value = '';
        document.getElementById('banner-label-pengumuman').value = 'Pemenang / Pengumuman';
        document.getElementById('banner-pengumuman').value = '';
        document.getElementById('banner-label-caraIkut').value = 'Cara Mengikuti';
        document.getElementById('banner-caraIkut').value = '';

        document.getElementById('banner-isiPesan').value = '';
        document.getElementById('banner-active').checked = true;
        deleteBtn.classList.add('hidden');
    }
    toggleBannerFields();
    document.getElementById('edit-banner-modal').classList.remove('hidden');
}
function closeEditBannerModal() { 
    document.getElementById('edit-banner-modal').classList.add('hidden'); 
}

            <div class="rounded-xl overflow-hidden mb-4" style="aspect-ratio: 2 / 1; background-color: #1A1A1A;">
                <img src="${imageUrl}" alt="${title}" style="width: 100%; height: 100%; object-fit: cover; display: block;" referrerpolicy="no-referrer">

        const labelCaraIkut = document.getElementById('banner-label-caraIkut').value || 'Cara Mengikuti';

        const caraIkutHtml = caraIkutRaw.split('\n').map(t => t.trim()).filter(t => t !== '').map(c => `<li>${c}</li>`).join('');
        
        el.innerHTML = `
            <div class="rounded-xl overflow-hidden mb-4" style="aspect-ratio: 2 / 1; background-color: #1A1A1A;">
                <img src="${imageUrl}" alt="${title}" style="width: 100%; height: 100%; object-fit: cover; display: block;" referrerpolicy="no-referrer">
            </div>
            <div class="card p-6 fade-up">
                <h3 class="text-lg font-bold text-pk mb-2">${title}</h3>
                <p class="text-xs text-gray-400 mb-4"><i class="fa-solid fa-calendar-days mr-2"></i> ${labelPeriode}: ${periode}</p>
                
                <div class="space-y-4 text-sm text-gray-300">
                    ${hadiah ? `
                    <div>
                        <h4 class="text-xs font-bold text-pk mb-1 uppercase tracking-wider">${labelHadiah}</h4>
                        <p class="text-base font-bold text-white">${hadiah}</p>
                    </div>` : ''}
                    ${pengumuman ? `
                    <div>
                        <h4 class="text-xs font-bold text-pk mb-1 uppercase tracking-wider">${labelPengumuman}</h4>
                        <p class="text-base text-white">${pengumuman}</p>
                    </div>` : ''}
                    ${caraIkutHtml ? `
                    <div class="pt-4 border-t border-dk-500/50">
                        <h4 class="text-xs font-bold text-pk mb-2 uppercase tracking-wider">${labelCaraIkut}</h4>
                        <ol class="list-decimal list-inside space-y-1 text-gray-400 text-xs leading-relaxed">
                            ${caraIkutHtml}
                        </ol>
                    </div>` : ''}
                </div>
            </div>
        `;
    }
    
    // Tampilkan modal preview
    document.getElementById('preview-banner-modal').classList.remove('hidden');
}
async function saveBannerChange() {
    const id = document.getElementById('banner-doc-id').value;
    const type = document.getElementById('banner-type').value;
    
    // Fungsi bantu untuk menggabungkan Date & Time menjadi ISO String
    const getISOTime = (dateId, timeId) => {
        const date = document.getElementById(dateId).value;
        const time = document.getElementById(timeId).value;
        if (date && time) {
            return new Date(`${date}T${time}`).toISOString();
        }
        return null;
    };

    const startISO = getISOTime('banner-scheduleStartDate', 'banner-scheduleStartTime');
    const endISO = getISOTime('banner-scheduleEndDate', 'banner-scheduleEndTime');

    const data = {
        type: type,
        imageUrl: document.getElementById('banner-imageUrl').value,
        title: document.getElementById('banner-title').value,
        scheduleStartTime: startISO,
        scheduleEndTime: endISO,
        active: document.getElementById('banner-active').checked
    };

    if (type === 'info') {
        data.isiPesan = document.getElementById('banner-isiPesan').value;
        data.labelPeriode = ''; data.periode = '';
        data.labelHadiah = ''; data.hadiah = '';
        data.labelPengumuman = ''; data.pengumuman = '';
        data.labelCaraIkut = ''; data.caraIkut = [];
    } else {
        data.labelPeriode = document.getElementById('banner-label-periode').value || 'Periode';
        data.periode = document.getElementById('banner-periode').value;
        data.labelHadiah = document.getElementById('banner-label-hadiah').value || 'Total Hadiah / Keuntungan';
        data.hadiah = document.getElementById('banner-hadiah').value;
        data.labelPengumuman = document.getElementById('banner-label-pengumuman').value || 'Pemenang / Pengumuman';
        data.pengumuman = document.getElementById('banner-pengumuman').value;
        data.labelCaraIkut = document.getElementById('banner-label-caraIkut').value || 'Cara Mengikuti';
        data.caraIkut = document.getElementById('banner-caraIkut').value.split('\n').map(t => t.trim()).filter(t => t !== '');
        data.isiPesan = '';
    }

    if (!data.imageUrl) { alert("URL Gambar wajib diisi!"); return; }
    showLoading();
    try {
        const { db, doc, setDoc, collection, updateDoc } = window.firebaseAdmin;
        if (!id) {
            const newDocRef = doc(collection(db, "banners"));
            await setDoc(newDocRef, data);
            showToast("Banner berhasil ditambahkan!");
        } else {
            await updateDoc(doc(db, "banners", id), data);
            showToast("Banner berhasil diperbarui!");
        }
        closeEditBannerModal();
    } catch (err) { 
        alert("Gagal menyimpan banner."); console.error(err); 
    } finally { 
        hideLoading(); 
    }
}

        async function deleteBanner() {
            const id = document.getElementById('banner-doc-id').value;
            if (!id) return;
            if (!confirm("Yakin ingin menghapus banner ini?")) return;
            showLoading();
            try {
                const { db, doc, deleteDoc } = window.firebaseAdmin;
                await deleteDoc(doc(db, "banners", id));
                showToast("Banner berhasil dihapus!");
                closeEditBannerModal();
            } catch (err) { alert("Gagal menghapus banner."); } 
            finally { hideLoading(); }
        }
        let allPromos = [];

        function loadPromos() {
            const { db, collection, query, onSnapshot } = window.firebaseAdmin;
            const tbody = document.getElementById('promos-table-body');
            tbody.innerHTML = `<tr><td colspan="4" class="text-center text-gray-500 py-8">Memuat data promo...</td></tr>`;
            const q = query(collection(db, "promo_codes"));
            onSnapshot(q, (snapshot) => {
                allPromos = [];
                snapshot.forEach((doc) => allPromos.push({ id: doc.id, data: doc.data() }));
                renderPromos();
            }, (error) => {
                tbody.innerHTML = `<tr><td colspan="4" class="text-center text-red-400 py-8">Gagal memuat data.</td></tr>`;
            });
        }

                function renderPromos() {
            const listEl = document.getElementById('promos-list');
            if (allPromos.length === 0) {
                listEl.innerHTML = '<p class="text-gray-500 text-sm col-span-full text-center py-8">Belum ada kode promo. Klik "Tambah Promo" untuk membuat baru.</p>';
                return;
            }
            
            listEl.innerHTML = allPromos.map(p => {
                const discount = p.data.discount ? `Rp ${p.data.discount.toLocaleString('id-ID')}` : 'Rp 0';
                const isActive = p.data.active !== false; // Default true jika field tidak ada
                const statusClass = isActive ? 'bg-green-500/20 text-green-400' : 'bg-red-500/20 text-red-400';
                const statusText = isActive ? 'Aktif' : 'Nonaktif';
                
                return `
                    <div class="card p-4 flex flex-col gap-3 relative">
                        <div class="flex justify-between items-start">
                            <div class="bg-dk-700 px-3 py-1.5 rounded-lg">
                                <p class="font-mono text-sm font-bold text-pk tracking-wider">${p.id}</p>
                            </div>
                            <span class="text-[10px] font-bold px-2 py-1 rounded-md ${statusClass} whitespace-nowrap">${statusText}</span>
                        </div>
                        
                        <div class="border-t border-dk-500/50 pt-3">
                            <p class="text-[11px] text-gray-500 uppercase tracking-wider mb-1">Nominal Diskon</p>
                            <p class="text-xl font-extrabold text-white">${discount}</p>
                        </div>
                        
                        <button onclick="openEditPromoModal('${p.id}')" class="btn-outline text-xs py-2 mt-2 w-full">
                            <i class="fa-solid fa-pen mr-1"></i> Edit / Hapus
                        </button>
                    </div>
                `;
            }).join('');
        }

        function openEditPromoModal(id = null) {
            const deleteBtn = document.getElementById('delete-promo-btn');
            const codeInput = document.getElementById('promo-code');
            
            if (id) {
                const p = allPromos.find(x => x.id === id);
                if (!p) return;
                document.getElementById('promo-doc-id').value = id;
                codeInput.value = id;
                codeInput.readOnly = true; // Kode promo tidak bisa diubah saat edit
                document.getElementById('promo-discount').value = p.data.discount || 0;
                document.getElementById('promo-active').checked = p.data.active !== false;
                deleteBtn.classList.remove('hidden');
            } else {
                document.getElementById('promo-doc-id').value = '';
                codeInput.value = '';
                codeInput.readOnly = false; // Bisa diketik saat buat baru
                document.getElementById('promo-discount').value = '';
                document.getElementById('promo-active').checked = true;
                deleteBtn.classList.add('hidden');
            }
            document.getElementById('edit-promo-modal').classList.remove('hidden');
        }

        function closeEditPromoModal() { 
            document.getElementById('edit-promo-modal').classList.add('hidden'); 
        }

        async function savePromoChange() {
            const id = document.getElementById('promo-doc-id').value;
            const code = document.getElementById('promo-code').value.trim().toUpperCase();
            const discount = parseInt(document.getElementById('promo-discount').value) || 0;
            const active = document.getElementById('promo-active').checked;

            if (!code) { alert("Kode promo wajib diisi!"); return; }

            showLoading();
            try {
                const { db, doc, setDoc, updateDoc } = window.firebaseAdmin;
                if (!id) {
                    // Buat baru (Doc ID = Kode Promo)
                    await setDoc(doc(db, "promo_codes", code), {
                        discount: discount,
                        active: active
                    });
                    showToast("Kode promo berhasil ditambahkan!");
                } else {
                    // Update promo lama
                    await updateDoc(doc(db, "promo_codes", id), {
                        discount: discount,
                        active: active
                    });
                    showToast("Kode promo berhasil diperbarui!");
                }
                closeEditPromoModal();
            } catch (err) { 
                alert("Gagal menyimpan promo."); console.error(err); 
            } finally { 
                hideLoading(); 
            }
        }

        async function deletePromo() {

            if (!confirm("Yakin ingin menghapus kode promo ini?")) return;
            showLoading();

            } catch (err) { 
                alert("Gagal menghapus promo."); 
            } finally {

            }
        }
        function requestNotificationPermission() {
            if (!('Notification' in window)) return;
            if (Notification.permission === 'default') {
                Notification.requestPermission().then(permission => { if (permission === 'granted') showToast('Notifikasi pesanan baru diaktifkan!'); });
            }
        }

        function showOrderNotification(orderData) {
            if (!('Notification' in window)) return;
            if (Notification.permission === 'granted') {
                const orderId = String(orderData.orderId || orderData.id || ''); 
                const total = orderData.total ? `Rp ${orderData.total.toLocaleString('id-ID')}` : 'Rp 0';
                let itemsText = orderData.items ? orderData.items.map(item => `${item.name}`).join(', ') : '-';
                if (itemsText.length > 40) itemsText = itemsText.substring(0, 40) + '...';
                const options = {
                    body: `${orderData.userName || 'Pelanggan'} - ${itemsText}\nTotal: ${total}`,
                    icon: 'Logo_WH_intuls-removebg-preview.png',
                    badge: 'Logo_WH_intuls-removebg-preview.png',
                    tag: 'new-order-' + Date.now(),
                    data: { orderId: orderId, url: './index.html?orderId=' + orderId }
                };
                try {
                    if ('serviceWorker' in navigator) {
                        navigator.serviceWorker.ready.then(registration => { registration.showNotification('🔔 Pesanan Baru RANEL CELL!', options); });
                    } else {
                        const notif = new Notification('🔔 Pesanan Baru RANEL CELL!', options);
                        notif.onclick = () => { window.focus(); notif.close(); };
                    }
                } catch (e) { console.error("Gagal membuat notifikasi:", e); }
            }
        }

        function showToast(msg) {
            const t = document.createElement('div');
            t.className = 'fixed top-4 left-1/2 -translate-x-1/2 bg-green-500 text-white px-6 py-3 rounded-lg shadow-lg z-50 font-medium text-sm';
            t.textContent = msg;
            document.body.appendChild(t);
            setTimeout(() => t.remove(), 3000);
        }

        navigator.serviceWorker.addEventListener('message', event => {
            if (event.data && event.data.type === 'OPEN_ORDER_DETAIL') {
                const orderId = String(event.data.orderId || '');
                if (orderId) {
                    switchTab('orders');
                    const orderObj = allOrders.find(o => o.id === orderId);
                    if (orderObj) openEditModal(orderId);
                    else pendingOrderId = orderId; 
                }
            }
        });
    </script>
